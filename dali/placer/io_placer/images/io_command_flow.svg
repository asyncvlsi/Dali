<text x="712.5" y="177" class="heading" text-anchor="middle">Manual review loop</text>
<text x="712.5" y="208" class="small" text-anchor="middle">show, place, move, check</text>
<rect x="905" y="155" width="235" height="115" rx="5" fill="#eef5f8" stroke="#24313a" stroke-width="2"/>
