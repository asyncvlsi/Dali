<polygon points="290,212 278,205 278,219" fill="#24313a"/>
<line x1="520" y1="212" x2="570" y2="212" stroke="#24313a" stroke-width="3"/>
<polygon points="570,212 558,205 558,219" fill="#24313a"/>
<line x1="845" y1="212" x2="895" y2="212" stroke="#24313a" stroke-width="3"/>
<polygon points="895,212 883,205 883,219" fill="#24313a"/>
