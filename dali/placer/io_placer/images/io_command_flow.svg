<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<title>Dali I/O placement command and signoff flow</title>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24313a}.title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:700}.label{font-size:16px}.small{font-size:14px;fill:#61717d}</style>
<rect width="1200" height="600" fill="#ffffff"/>
